name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # update.yml calls this after committing new data. Commits made with
  # GITHUB_TOKEN don't trigger push workflows, so it has to be called directly.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When called from update.yml, take the branch head (with the new data),
          # not the commit the run started from.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: |
          python -m pytest -q
          node --test tests/

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m pipeline.build_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
