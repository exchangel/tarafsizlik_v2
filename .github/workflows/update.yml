name: Update news

on:
  schedule:
    # 06:15, 14:15, 22:15 UTC = 09:15, 17:15, 01:15 in Turkey.
    # Quarter past, because runs on the full hour get delayed a lot.
    - cron: "15 6,14,22 * * *"
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python -m pipeline.fetch_news

      - name: Cluster with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.cluster_news

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
